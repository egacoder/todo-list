<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
  />
  <meta name="referrer" content="no-referrer" />
  <title>Список задач</title>
  <meta name="description" content="Простой и аккуратный список задач: добавляйте, отмечайте и удаляйте задачи. Всё сохраняется в браузере и работает офлайн." />
  <meta name="theme-color" content="#f5f6fa" id="theme-color" />
  <meta name="color-scheme" content="light dark" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Список задач" />
  <meta property="og:description" content="Аккуратный список задач на чистом JavaScript: работает офлайн, сохраняет данные, поддерживает тёмную тему." />
  <meta property="og:image" content="https://egacoder.github.io/todo-list/icons/og-image.png" />
  <meta property="og:url" content="https://egacoder.github.io/todo-list/" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Тема применяется до отрисовки, чтобы не было «вспышки» светлой темы -->
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div>
        <p class="app__date" id="today"></p>
        <h1 class="app__title">Мои задачи</h1>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Включить тёмную тему" title="Сменить тему">
        <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <section class="card" aria-labelledby="list-heading">
      <h2 id="list-heading" class="visually-hidden">Список задач</h2>

      <form class="new-task" id="new-task-form" autocomplete="off" novalidate>
        <label for="new-task-input" class="visually-hidden">Новая задача</label>
        <input
          id="new-task-input"
          class="new-task__input"
          type="text"
          placeholder="Что нужно сделать?"
          maxlength="200"
          enterkeyhint="done"
          aria-describedby="new-task-error"
        />
        <button class="btn btn--primary" type="submit" aria-label="Добавить задачу">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Добавить</span>
        </button>
      </form>
      <p class="new-task__error" id="new-task-error" role="alert"></p>

      <div class="progress" id="progress" hidden>
        <div class="progress__info">
          <span id="progress-label"></span>
          <span id="progress-value">0%</span>
        </div>
        <div class="progress__track" role="progressbar" aria-labelledby="progress-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
      </div>

      <nav class="filters" id="filters" aria-label="Фильтр задач" hidden>
        <button type="button" class="filters__btn" data-filter="all" aria-pressed="true">Все <span class="badge" data-count="all"></span></button>
        <button type="button" class="filters__btn" data-filter="active" aria-pressed="false">Активные <span class="badge" data-count="active"></span></button>
        <button type="button" class="filters__btn" data-filter="completed" aria-pressed="false">Выполненные <span class="badge" data-count="completed"></span></button>
      </nav>

      <ul class="task-list" id="task-list"></ul>

      <div class="empty" id="empty-state">
        <svg class="empty__icon" viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="8" width="40" height="48" rx="6"/><path d="M22 22h20M22 32h20M22 42h12"/></svg>
        <p class="empty__title" id="empty-title">Задач пока нет</p>
        <p class="empty__text" id="empty-text">Добавьте первую задачу — она сохранится даже после перезагрузки страницы.</p>
      </div>

      <footer class="card__footer" id="footer" hidden>
        <span id="items-left"></span>
        <div class="card__footer-actions">
          <button type="button" class="link-btn" id="toggle-all">Отметить все</button>
          <button type="button" class="link-btn link-btn--danger" id="clear-completed">Удалить выполненные</button>
        </div>
      </footer>
    </section>

    <p class="hint">
      <kbd>/</kbd> новая задача · <kbd>Alt</kbd>+<kbd>↑</kbd><kbd>↓</kbd> порядок · <kbd>Ctrl</kbd>+<kbd>Z</kbd> отменить удаление
    </p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <p class="visually-hidden" id="announcer" aria-live="polite" aria-atomic="true"></p>

  <template id="task-template">
    <li class="task">
      <button type="button" class="task__handle" data-action="drag" aria-label="Переместить задачу">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
      </button>
      <label class="checkbox">
        <input type="checkbox" class="checkbox__input" data-action="toggle" />
        <span class="checkbox__box" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
      </label>
      <span class="task__title"></span>
      <input class="task__edit" type="text" maxlength="200" enterkeyhint="done" aria-label="Изменить текст задачи" hidden />
      <div class="task__actions">
        <button type="button" class="icon-btn icon-btn--sm icon-btn--star" data-action="important" aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn--sm" data-action="edit">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn--sm icon-btn--danger" data-action="delete">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </li>
  </template>

  <noscript><p class="noscript">Для работы списка задач включите JavaScript.</p></noscript>
</body>
</html>
