<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Список задач</title>
  <meta name="description" content="Простой и аккуратный список задач: добавляйте, отмечайте и удаляйте задачи. Всё сохраняется в браузере." />
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bf7'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Применяем тему до отрисовки, чтобы не было «вспышки» светлой темы
    try {
      const t = localStorage.getItem('todo-list:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div>
        <p class="app__date" id="today"></p>
        <h1 class="app__title">Мои задачи</h1>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Сменить тему" title="Сменить тему">
        <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <section class="card" aria-labelledby="list-heading">
      <h2 id="list-heading" class="visually-hidden">Список задач</h2>

      <form class="new-task" id="new-task-form" autocomplete="off">
        <label for="new-task-input" class="visually-hidden">Новая задача</label>
        <input
          id="new-task-input"
          class="new-task__input"
          type="text"
          placeholder="Что нужно сделать?"
          maxlength="200"
          required
          autofocus
        />
        <button class="btn btn--primary" type="submit">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Добавить</span>
        </button>
      </form>

      <div class="progress" id="progress" hidden>
        <div class="progress__info">
          <span id="progress-label"></span>
          <span id="progress-value">0%</span>
        </div>
        <div class="progress__track" role="progressbar" aria-labelledby="progress-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
      </div>

      <nav class="filters" id="filters" aria-label="Фильтр задач" hidden>
        <button type="button" class="filters__btn" data-filter="all" aria-pressed="true">Все <span class="badge" data-count="all"></span></button>
        <button type="button" class="filters__btn" data-filter="active" aria-pressed="false">Активные <span class="badge" data-count="active"></span></button>
        <button type="button" class="filters__btn" data-filter="completed" aria-pressed="false">Выполненные <span class="badge" data-count="completed"></span></button>
      </nav>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>

      <div class="empty" id="empty-state">
        <svg class="empty__icon" viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="8" width="40" height="48" rx="6"/><path d="M22 22h20M22 32h20M22 42h12"/></svg>
        <p class="empty__title" id="empty-title">Задач пока нет</p>
        <p class="empty__text" id="empty-text">Добавьте первую задачу — она сохранится даже после перезагрузки страницы.</p>
      </div>

      <footer class="card__footer" id="footer" hidden>
        <span id="items-left"></span>
        <button type="button" class="link-btn" id="clear-completed">Удалить выполненные</button>
      </footer>
    </section>

    <p class="hint">Двойной клик по задаче — редактирование · <kbd>Enter</kbd> — сохранить · <kbd>Esc</kbd> — отмена</p>

    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </main>

  <template id="task-template">
    <li class="task">
      <label class="checkbox">
        <input type="checkbox" class="checkbox__input" data-action="toggle" />
        <span class="checkbox__box" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
      </label>
      <span class="task__title"></span>
      <input class="task__edit" type="text" maxlength="200" hidden />
      <div class="task__actions">
        <button type="button" class="icon-btn icon-btn--sm" data-action="edit">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn--sm icon-btn--danger" data-action="delete">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </li>
  </template>

  <noscript><p class="noscript">Для работы списка задач включите JavaScript.</p></noscript>
</body>
</html>
